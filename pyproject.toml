[project]
name = "home-rental-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "google-auth>=2.37.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.160.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "apscheduler>=3.10.0",
    "docusign-esign>=6.1.0",
    "seam>=1.0.0",
    # Dashboard login via Google OIDC ("Sign in with Google"). authlib handles
    # the OAuth2/OpenID-Connect flow + id_token verification; itsdangerous backs
    # Starlette's SessionMiddleware (signed session cookie).
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    # The deploy base image (python:3.12-slim) ships no system tz database;
    # every ET-based domain rule resolves a zone via zoneinfo.ZoneInfo, so the
    # IANA data must travel with the app or the app crashes on startup.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "slow: runs a real subprocess pipeline (export + gitleaks scan); deselect with -m 'not slow'",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
target-version = "py312"
line-length = 100
