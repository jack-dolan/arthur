[project]
name = "home-rental-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "google-auth>=2.37.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.160.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "apscheduler>=3.10.0",
    "docusign-esign>=6.1.0",
    "seam>=1.0.0",
    # Dashboard login via Google OIDC ("Sign in with Google"). authlib handles
    # the OAuth2/OpenID-Connect flow + id_token verification; itsdangerous backs
    # Starlette's SessionMiddleware (signed session cookie).
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    # The deploy base image (python:3.12-slim) ships no system tz database;
    # every ET-based domain rule resolves a zone via zoneinfo.ZoneInfo, so the
    # IANA data must travel with the app or the app crashes on startup.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "slow: runs a real subprocess pipeline (export + gitleaks scan); deselect with -m 'not slow'",
]

[tool.ruff.lint]
# "S" is flake8-bandit: it is this project's SAST layer, so static security
# analysis rides along with the linter instead of needing a second tool.
select = ["E", "F", "I", "S"]

# Suppressions are per-line (`# noqa: SNNN`, with the reason in a comment above)
# everywhere in app/, so every production finding is an individual, reviewed
# judgement. The entries below are the opposite case: whole rule families that
# are structurally inapplicable to a tree, where per-line markers would be noise
# rather than signal.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # `assert` is the entire point of a test. 1100+ occurrences.
    "S101",
    # Credential-shaped literals in tests are mandated placeholders, never real
    # values -- see the privacy rules in CLAUDE.md and the testing-safely skill.
    "S105",
    "S106",
    # Test harnesses shell out to git, bash and docker with literal argument
    # lists (never a shell string, never interpolated input).
    "S603",
    "S607",
    # "/tmp/..." here is a fixture string compared against a mock, not a file
    # this process ever opens.
    "S108",
    # Several suites are organised in banner-separated sections and import what
    # each section needs at its head. That is a deliberate readability choice in
    # a test file, where it costs nothing.
    "E402",
]
"scripts/manual/**" = [
    # Operator-run credential helpers: urlopen targets are module constants
    # (Google and DocuSign endpoints), and subprocess calls use literal argv.
    "S310",
    "S603",
    "S607",
]

[tool.ruff]
target-version = "py312"
line-length = 100
